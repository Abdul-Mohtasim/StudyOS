    <script>
      // Mark the Android app early so the launch splash shows before anything else.
      try {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
          document.documentElement.classList.add("native-app");
        }
      } catch (e) {}
    </script>
    <style>
      #boot-splash { display: none; }
      html.native-app #boot-splash {
        display: flex; position: fixed; inset: 0; z-index: 2147483000;
        align-items: center; justify-content: center;
        background: linear-gradient(135deg, #ffdcc4 0%, #ffc19d 50%, #ffdcc4 100%);
        transition: opacity .5s ease;
      }
      #boot-splash svg { width: 150px; height: auto; transform: translateZ(0);
        animation: boot-in .6s cubic-bezier(.2,.8,.2,1) both; }
      #boot-splash.hide { opacity: 0; pointer-events: none; }
      @keyframes boot-in { from { opacity: 0; transform: scale(.9) translateZ(0); } to { opacity: 1; transform: scale(1) translateZ(0); } }
      @media (prefers-color-scheme: dark) {
        html.native-app #boot-splash { background: linear-gradient(135deg, #19131f 0%, #2d1c30 50%, #19131f 100%); }
      }
    </style>
