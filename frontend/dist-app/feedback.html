<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyOS Feedback</title><link rel="icon" type="image/png" href="/icons/icon-192.png"><style>
:root{color-scheme:dark;--bg:#101d22;--panel:#122126;--field:#1b2d33;--line:#34464e;--text:#f5f8f9;--muted:#8b9ba3;--accent:#45b8ee;--btn:#08222e;--brand:#83d539;--danger:#f47c83}:root[data-theme=light]{color-scheme:light;--bg:#f4f8fa;--panel:#fff;--field:#edf4f6;--line:#c7d7dc;--text:#17262c;--muted:#5e727a;--accent:#168fc6;--btn:#fff;--brand:#599f20}:root[data-palette=ocean]{--bg:#d6e8f1;--panel:#eaf3fb;--field:#d9ebf6;--line:#b9d0de;--text:#14303f;--muted:#44677c;--accent:#1d4560;--btn:#fff;--brand:#2b6082}:root[data-palette=forest]{--bg:#dde8df;--panel:#eaf4ec;--field:#dcefe2;--line:#bdd1c3;--text:#16301f;--muted:#46654f;--accent:#1f4a33;--btn:#fff;--brand:#2f6b4a}:root[data-palette=sunset]{--bg:#f1ddd5;--panel:#f9ece6;--field:#fae3d9;--line:#e3c8bc;--text:#3b1d12;--muted:#7a5446;--accent:#7e3519;--btn:#fff;--brand:#b4532f}:root[data-palette=mono]{--bg:#e6e6e6;--panel:#f5f5f5;--field:#e9e9e9;--line:#cfcfcf;--text:#1e1e1e;--muted:#5c5c5c;--accent:#000;--btn:#fff;--brand:#1e1e1e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:600 14px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100vw - 1320px)/2));background:var(--panel)}.brand{color:var(--brand);font-size:21px;font-weight:900;letter-spacing:-1px;text-decoration:none}.wrap{width:min(100%,760px);margin:auto;padding:18px 12px 58px}.crumbs{display:flex;gap:13px;align-items:center;color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.06em}.crumbs a{color:inherit;text-decoration:none}.current,.sep{color:var(--muted)}h1{text-align:center;font-size:21px;letter-spacing:-.3px;margin:33px 0 31px}.card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:24px;display:grid;grid-template-columns:.9fr 1.1fr;gap:34px}.intro h2{font-size:13px;margin:0 0 19px}.intro p{color:var(--muted);font-size:13px;font-weight:500;margin:0;line-height:1.35}form{display:flex;flex-direction:column;gap:13px}label{font-size:12px;font-weight:900}em{color:var(--danger);font-style:normal}input,textarea,select{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text);font:600 14px/1.3 inherit;padding:8px 10px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent),transparent 75%)}textarea{min-height:82px;resize:vertical}select{appearance:auto}.drop{display:block;margin-top:5px;border:1px dashed var(--line);border-radius:10px;padding:21px 10px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer}.drop b{color:var(--accent)}.drop.over{border-color:var(--accent);background:var(--field)}.filename{margin-top:5px;font-size:11px;color:var(--text)}.hidden{display:none}.button{align-self:flex-end;border:0;border-radius:12px;background:var(--accent);color:var(--btn);padding:11px 24px;font:900 11px/1 Nunito,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--accent),#000 24%)}.button:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent),#000 24%)}.notice{border-radius:8px;padding:10px;font-size:12px}.ok{background:color-mix(in srgb,#46bd75,transparent 84%);color:#46bd75}.err{background:color-mix(in srgb,var(--danger),transparent 84%);color:var(--danger)}@media(max-width:560px){.card{grid-template-columns:1fr;gap:25px;padding:24px}.button{align-self:flex-end}}
</style></head><body><header class="top"><a class="brand" href="/">StudyOS</a></header><main class="wrap"><nav class="crumbs"><a id="helpLink" href="/help.html">HELP CENTER</a><span class="sep">›</span><span class="current">FEEDBACK</span></nav><h1>What can we help you with?</h1><section class="card"><div class="intro"><h2>Describe your issue</h2><p>Please describe the issue you are experiencing in as much detail as possible. This will help us understand what’s going on.</p></div><form id="fbForm" action="https://formsubmit.co/ajax/abdulmohtasim034@gmail.com" method="POST" enctype="multipart/form-data"><input type="hidden" name="_subject" value="New StudyOS feedback"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_template" value="table"><label>Your Email Address <em>*</em><input name="email" type="email" required placeholder="you@example.com"></label><label>Subject <em>*</em><input name="subject" required></label><label>Description <em>*</em><textarea name="description" required></textarea></label><label>Type of issue <em>*</em><select name="type" required><option value="" selected disabled>Please select one...</option><option>Bug report</option><option>Sync or data issue</option><option>Account access</option><option>Gem Shop purchase</option><option>Feature request</option><option>Other</option></select></label><label>Attachments<span class="drop" id="drop"><b>Add file</b> or drop files here<div class="filename" id="fileName"></div></span></label><input class="hidden" id="file" name="attachment" type="file"><button class="button" id="submit" type="submit">SUBMIT</button><div id="notice"></div></form></section></main><script>
const params=new URLSearchParams(location.search),theme=params.get('theme'),palette=params.get('palette');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;if(['ocean','forest','sunset','mono'].includes(palette))document.documentElement.dataset.palette=palette;document.getElementById('helpLink').href='/help.html'+location.search;const drop=document.getElementById('drop'),file=document.getElementById('file'),name=document.getElementById('fileName');drop.onclick=()=>file.click();['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>{if(e.dataTransfer.files.length){file.files=e.dataTransfer.files;name.textContent=file.files[0].name}});file.onchange=()=>name.textContent=file.files[0]?.name||'';const form=document.getElementById('fbForm'),submit=document.getElementById('submit'),notice=document.getElementById('notice');form.onsubmit=async e=>{e.preventDefault();notice.innerHTML='';submit.disabled=true;submit.textContent='SENDING...';try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(!response.ok)throw Error();notice.innerHTML='<div class="notice ok">Thanks! Your message is on its way to the StudyOS team.</div>';form.reset();name.textContent=''}catch{notice.innerHTML='<div class="notice err">Something went wrong. Please try again, or email us directly.</div>'}finally{submit.disabled=false;submit.textContent='SUBMIT'}};
</script></body></html>
