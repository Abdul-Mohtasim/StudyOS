<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyOS Help Center</title><link rel="icon" type="image/png" href="/icons/icon-192.png"><style>
:root{color-scheme:dark;--bg:#101d22;--panel:#122126;--line:#34464e;--text:#f5f8f9;--muted:#8b9ba3;--accent:#45b8ee;--btn:#08222e;--brand:#83d539}:root[data-theme=light]{color-scheme:light;--bg:#f4f8fa;--panel:#fff;--line:#c7d7dc;--text:#17262c;--muted:#5e727a;--accent:#168fc6;--btn:#fff;--brand:#599f20}:root[data-palette=ocean]{--bg:#d6e8f1;--panel:#eaf3fb;--line:#b9d0de;--text:#14303f;--muted:#44677c;--accent:#1d4560;--btn:#fff;--brand:#2b6082}:root[data-palette=forest]{--bg:#dde8df;--panel:#eaf4ec;--line:#bdd1c3;--text:#16301f;--muted:#46654f;--accent:#1f4a33;--btn:#fff;--brand:#2f6b4a}:root[data-palette=sunset]{--bg:#f1ddd5;--panel:#f9ece6;--line:#e3c8bc;--text:#3b1d12;--muted:#7a5446;--accent:#7e3519;--btn:#fff;--brand:#b4532f}:root[data-palette=mono]{--bg:#e6e6e6;--panel:#f5f5f5;--line:#cfcfcf;--text:#1e1e1e;--muted:#5c5c5c;--accent:#000;--btn:#fff;--brand:#1e1e1e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:600 14px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100vw - 1320px)/2));background:var(--panel)}.brand{color:var(--brand);font-size:21px;font-weight:900;letter-spacing:-1px;text-decoration:none}.wrap{width:min(100%,760px);margin:auto;padding:18px 12px 58px}.crumbs{display:flex;gap:13px;align-items:center;color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.06em}.crumbs a{color:inherit;text-decoration:none}.current,.sep{color:var(--muted)}h1{text-align:center;font-size:21px;letter-spacing:-.3px;margin:33px 0 31px}.category{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);margin:0 0 31px}.category h2{font-size:12px;color:var(--accent);margin:0;padding:17px 21px;border-bottom:1px solid var(--line)}details+details{border-top:1px solid var(--line)}summary{list-style:none;cursor:pointer;padding:16px 21px;display:flex;justify-content:space-between;align-items:center;gap:16px}summary::-webkit-details-marker{display:none}.chev{width:18px;color:var(--muted);transition:transform .18s}details[open] .chev{transform:rotate(180deg)}details[open] summary{color:var(--accent)}.answer{padding:0 21px 18px;color:var(--muted);font-weight:500}.answer p{margin:0}.cta{text-align:center;margin:33px 0 0}.cta p{font-size:12px;font-weight:900;margin:0 0 17px}.button{border:0;border-radius:12px;background:var(--accent);color:var(--btn);display:inline-block;padding:11px 19px;font:900 11px/1 Nunito,system-ui,sans-serif;letter-spacing:.08em;text-decoration:none;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--accent),#000 24%)}.button:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent),#000 24%)}
</style></head><body><header class="top"><a class="brand" href="/">StudyOS</a></header><main class="wrap"><nav class="crumbs"><a href="/help.html">HELP CENTER</a><span class="sep">›</span><span class="current">HOME</span></nav><h1>Frequently Asked Questions</h1><div id="faq"></div><div class="cta"><p>Still unsure about something?</p><a class="button" id="feedbackLink" href="/feedback.html">SEND FEEDBACK</a></div></main><script>
const p=new URLSearchParams(location.search),t=p.get('theme'),a=p.get('palette');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(['ocean','forest','sunset','mono'].includes(a))document.documentElement.dataset.palette=a;document.getElementById('feedbackLink').href='/feedback.html'+location.search;
const groups=[['Using StudyOS',[['What is a streak?','Your streak is the number of days in a row that you reach your daily study goal. Complete a task or focus session each day to keep it going.'],['How do daily goals work?','Set a daily study-time target in Settings. Your progress updates as you complete focus sessions and tasks.'],['What are gems and how do I earn them?','Earn gems through study sessions, completed tasks, and streaks. Spend them in the Gem Shop.'],['How does the leaderboard work?','The Friends leaderboard ranks people you follow by gems earned.'],['Can I use StudyOS offline?','Yes. Your work is saved locally and syncs when your connection returns.']]],['Account Management',[['How do I change my name, username or email?','Open Settings → Profile to update your profile details.'],['How do I find and follow friends on StudyOS?','Use the Friends tab to search by username, share a QR code, or invite contacts.'],['How do I export or reset my data?','Use Settings → Export my data. Contact us through feedback for help resetting study history.'],['I’m having trouble accessing my account.','Use the same sign-in method you originally chose, or reset your password from the sign-in screen.'],['How do I delete my account and my data?','Contact us from the feedback form using the email address connected to your StudyOS account.']]],['Gems & Shop',[['What can I buy in the Gem Shop?','The shop offers study rewards such as Streak Freezes, boosts, themes, and gifts.'],['Is StudyOS free?','Yes. StudyOS is free to use.'],['I didn’t receive an item from the Gem Shop.','Reopen the app first. If the item is still missing, send us the details through feedback.']]]];const arrow='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';document.getElementById('faq').innerHTML=groups.map(([name,rows])=>`<section class="category"><h2>${name}</h2>${rows.map(([q,answer])=>`<details><summary>${q}${arrow}</summary><div class="answer"><p>${answer}</p></div></details>`).join('')}</section>`).join('');
</script></body></html>
